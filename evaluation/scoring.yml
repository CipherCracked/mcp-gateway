# Scoring configuration — Secure MCP Gateway RL Gym task
#
# Per-check weighted partial credit (HackerRank-Bench methodology):
#   score = sum(weight_i * completion_i) / sum(weight_i)
#   where completion_i is 1 if the check passed, 0 if failed or blocked.
# Each check individually earns its weight if passed, 0 if failed or blocked.
# Blocked checks earn 0 but are distinguished from failed checks so the
# verifier can report an unevaluable check separately from a broken one.
#
# The reference solution must achieve 100%. Mutants must be detected (tests fail
# against each mutant). Frontier models are expected to score <30%.

scoring:
  # A check is "passed" only if its associated test(s) pass.
  # Total score = sum of weights for passed checks (weighted partial credit per check).
  # A check that cannot be evaluated (e.g. its safety property is not established)
  # is "blocked": it earns 0 but is distinguished from "failed" so the verifier
  # can report an unevaluable check separately from a genuinely broken one.
  reference_target: 100
  mutant_detection_required: true
  frontier_model_ceiling: 30

check_groups:
  - name: authentication
    checks:
      - id: AUTH-001
        weight: 0.05
      - id: AUTH-002
        weight: 0.05
      - id: AUTH-003
        weight: 0.02
  - name: authorization
    checks:
      - id: AUTHZ-001
        weight: 0.04
      - id: AUTHZ-002
        weight: 0.04
      - id: AUTHZ-003
        weight: 0.04
  - name: discovery
    checks:
      - id: DISC-001
        weight: 0.05
      - id: DISC-002
        weight: 0.03
  - name: invocation
    checks:
      - id: INV-001
        weight: 0.05
      - id: INV-002
        weight: 0.03
  - name: validation
    checks:
      - id: VAL-001
        weight: 0.015
      - id: VAL-002
        weight: 0.015
      - id: VAL-003
        weight: 0.02
      - id: VAL-004
        weight: 0.015
      - id: VAL-005
        weight: 0.015
      - id: VAL-006
        weight: 0.01
  - name: lifecycle
    checks:
      - id: LIF-001
        weight: 0.025
      - id: LIF-002
        weight: 0.025
      - id: LIF-003
        weight: 0.015
      - id: LIF-004
        weight: 0.015
      - id: LIF-005
        weight: 0.01
  - name: limits
    checks:
      - id: LIM-001
        weight: 0.03
      - id: LIM-002
        weight: 0.03
      - id: LIM-003
        weight: 0.02
      - id: LIM-004
        weight: 0.02
  - name: failure_modes
    checks:
      - id: FAIL-001
        weight: 0.03
      - id: FAIL-002
        weight: 0.03
      - id: FAIL-003
        weight: 0.02
  - name: persistence
    checks:
      - id: PERS-001
        weight: 0.04
      - id: PERS-002
        weight: 0.02
  - name: revocation
    checks:
      - id: REV-001
        weight: 0.03
      - id: REV-002
        weight: 0.03
      - id: REV-003
        weight: 0.02
  - name: sanitization
    checks:
      - id: SAN-001
        weight: 0.08
  - name: global
    checks:
      - id: GEN-001
        weight: 0.02

pass_threshold: 1.0  # reference must pass all checks

mutants:
  - id: MUT-AUTH-DISABLED
    description: Authentication check removed
    file: mutants/mut_auth_disabled/main.py
    expected: AUTH-001, AUTH-002 fail
  - id: MUT-WRONG-CODE
    description: FORBIDDEN_TOOL returns 404 instead of 403
    file: mutants/mut_wrong_code/errors.py
    expected: AUTHZ-002 fails
  - id: MUT-NO-SANITIZE
    description: Stack traces leaked in error responses
    file: mutants/mut_no_sanitize/errors.py
    expected: SAN-001 fails
  - id: MUT-NO-RATELIMIT
    description: Rate limiter always allows
    file: mutants/mut_no_ratelimit/limits.py
    expected: LIM-001 fails
  - id: MUT-NO-CONCURRENCY
    description: Concurrency limiter always allows
    file: mutants/mut_no_concurrency/limits.py
    expected: LIM-002 fails
  - id: MUT-NO-REVOCATION
    description: SIGHUP does not reload config
    file: mutants/mut_no_revocation/main.py
    expected: REV-001, REV-002 fail

# Blocked-state schema: a check whose safety property cannot be established is
# "blocked" rather than "failed". It earns 0 weight but is reported separately so
# the verifier can distinguish an unevaluable check from a genuinely broken one.
blocked_state:
  # A check is blocked when its precondition cannot be verified (e.g. the
  # gateway is not running, a prerequisite fixture is unavailable, or a
  # skip-conditional such as "skipped on Windows" is met).
  blocked_earns: 0
  distinguished_from_failed: true
  report_as: "blocked"  # distinct status value alongside "passed" and "failed"

# Verifier quality targets (Context A — static eval task).
# Context B measures (TTS/AUC/ECE, adversarial coverage >90%, false-negative
# pipelines, drift monitoring, reward-hacking detection) are documented in
# docs/rl-gym-evaluation-standards/itds/verifier-quality-measurement.md and
# deferred for future RL-training pipelines; they are not part of this task.
verifier_quality:
  # Every functional ("did it") check should be paired with an invariant
  # ("didn't break") check so silent invariant violations are caught rather
  # than exploited (variant/invariant testing). Applied now via check pairing.
  check_pairing_required: true
  # Mutant detection rate reported as a separate metric alongside reference score.
  detection_rate_required: true
  # Reference solution must pass 100% of checks (surfaces wrongful rejections).
  reference_pass_required: 100
  # Adversarial gap awareness: a verifier catching only 60% of errors leaves a
  # 40% gap models find and exploit. Check pairing closes part of that gap at
  # design time; adversarial coverage targets (>90%) are Context B / deferred.
  adversarial_gap_aware: true
